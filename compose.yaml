services:
  postgres:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: relio
      POSTGRES_USER: relio
      POSTGRES_PASSWORD: relio-local-password
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relio -d relio"]
      interval: 5s
      timeout: 3s
      retries: 20
  relio:
    build:
      context: .
      args:
        VERSION: 0.1.0-dev
        GIT_COMMIT: local
        BUILD_DATE: local
    image: relio:dev
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      POSTGRES_DSN: postgres://relio:relio-local-password@postgres:5432/relio?sslmode=disable
      BOOTSTRAP_ADMIN: admin
      BOOTSTRAP_ADMIN_PASSWORD: ChangeMe-Relio-2026
    volumes:
      - relio-data:/var/lib/relio
volumes:
  postgres-data:
  relio-data:
