name: Release Offline Docker Image

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Validate semantic tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]
      - name: Test source
        run: |
          npm --prefix web ci
          npm --prefix web audit --audit-level=high
          npm --prefix web run typecheck
          npm --prefix web run build
          go test ./...
          go vet ./...
      - name: Check offline and environment contracts
        run: |
          ./scripts/check-env-contract.sh
          ./scripts/check-static-assets.sh
      - name: Build versioned Docker image
        run: |
          version="${GITHUB_REF_NAME#v}"
          image_tag="${GITHUB_REF_NAME}"
          docker build \
            --build-arg VERSION="$version" \
            --build-arg GIT_COMMIT="${GITHUB_SHA::8}" \
            --build-arg BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -t "relio:$image_tag" .
      - name: Verify image offline
        run: |
          image_tag="${GITHUB_REF_NAME}"
          test "$(docker image inspect "relio:$image_tag" --format '{{.Config.User}}')" = "10001:10001"
          ./scripts/run-offline-container-test.sh "relio:$image_tag"
      - name: Verify upgrade from previous release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          previous_tag="$(git tag --sort=-v:refname | awk -v current="$GITHUB_REF_NAME" '$0 != current { print; exit }')"
          if [ -n "$previous_tag" ]; then
            previous_asset="relio-${previous_tag}.tar.gz"
            gh release download "$previous_tag" --repo "$GITHUB_REPOSITORY" --pattern "$previous_asset"
            gunzip -c "$previous_asset" | docker load
            ./scripts/run-upgrade-container-test.sh "relio:$previous_tag" "relio:$GITHUB_REF_NAME"
            rm "$previous_asset"
          fi
      - name: Package the only release asset
        run: |
          version="${GITHUB_REF_NAME#v}"
          image_tag="${GITHUB_REF_NAME}"
          asset="relio-v${version}.tar.gz"
          docker save "relio:$image_tag" | gzip -9 > "$asset"
          gzip -t "$asset"
          gunzip -c "$asset" | docker load
          docker image inspect "relio:$image_tag" >/dev/null
          digest="$(sha256sum "$asset" | awk '{print $1}')"
          size="$(du -h "$asset" | awk '{print $1}')"
          notes="docs/releases/${GITHUB_REF_NAME}.md"
          if [ -f "$notes" ]; then
            cp "$notes" release-body.md
          else
            cat > release-body.md <<EOF
          ## Relio v${version}

          완전 오프라인망 반입용 단일 Docker Image Release입니다.
          EOF
          fi
          cat >> release-body.md <<EOF

          ## 오프라인 이미지

          | 항목 | 값 |
          | --- | --- |
          | Asset | \`${asset}\` |
          | Docker Image | \`relio:${image_tag}\` |
          | SHA-256 | \`${digest}\` |
          | 압축 크기 | ${size} |
          | Architecture | \`linux/amd64\` |

          이 Release가 직접 제공하는 Asset은 위 Docker Image \`tar.gz\` 하나뿐입니다.

          ### 오프라인 서버에서 로드

          \`\`\`bash
          gunzip -c ${asset} | docker load
          docker image inspect relio:${image_tag}
          \`\`\`

          ### 실행

          \`\`\`bash
          # 최초 1회만 생성하고 비밀번호 관리 도구에 보관하세요.
          ENCRYPTION_KEY="\$(openssl rand -hex 32)"

          docker run -d \\
            --name relio \\
            -p 8080:8080 \\
            -e POSTGRES_DSN="postgres://relio:password@postgres:5432/relio" \\
            -e BOOTSTRAP_ADMIN="admin" \\
            -e BOOTSTRAP_ADMIN_PASSWORD="ChangeMe-Immediately" \\
            -e ENCRYPTION_KEY="\$ENCRYPTION_KEY" \\
            -v relio-data:/var/lib/relio \\
            relio:${image_tag}
          \`\`\`

          Relio Application이 받는 환경변수는 필수 3개(\`POSTGRES_DSN\`, \`BOOTSTRAP_ADMIN\`, \`BOOTSTRAP_ADMIN_PASSWORD\`)와 선택 1개(\`ENCRYPTION_KEY\`)뿐입니다.

          \`ENCRYPTION_KEY\`를 설정하면 Personal Key와 SSO Client Secret이 재기동, 이미지 교체, \`relio-data\` Volume 재생성 후에도 유지됩니다. 설정하지 않으면 자격증명을 여는 Key가 Volume 안에만 존재하므로 \`/var/lib/relio\`를 PostgreSQL과 같은 복구 시점으로 반드시 보존해야 합니다.

          ## 검증

          Release 전에 Source Test, TypeScript Typecheck, Frontend Build, Go Vet, 환경변수 계약, 외부 정적 Asset 차단, 비 Root 실행, 완전 격리 Network 신규 설치 Smoke Test, 이전 Release 업그레이드 Test, Docker Save/Load 재검증을 통과합니다.
          EOF
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-body.md
          files: relio-v*.tar.gz
          fail_on_unmatched_files: true
          generate_release_notes: false
